seed: 7
deterministic: true

data:
  raw_csv: results/regenerated/smoke/ngsim_smoke.csv
  processed_path: results/regenerated/smoke/dataset.npz
  scaler_path: results/regenerated/smoke/scaler.json
  manifest_path: results/regenerated/smoke/manifest.json
  sample_rows: null
  sample_seed: 7
  csv_chunk_rows: 1000
  sequence_length: 15
  graph_radius_m: 20.0
  coordinate_scale_to_m: 1.0
  min_graph_nodes: 2
  max_graphs: 24
  require_consecutive_frames: true
  feature_columns: [Local_X, Local_Y, v_Vel, v_Acc]
  label_column: Risk_Class
  frame_column: Frame_ID
  vehicle_column: Vehicle_ID
  time_column: Global_Time
  graph_label_reduction: max
  split:
    train: 0.70
    validation: 0.15
    test: 0.15
    strategy: chronological
    gap_frames: 0
  labeling:
    source: existing_or_heuristic
    low_class: 0
    medium_class: 1
    high_class: 2
    medium_time_headway_s: 2.0
    high_time_headway_s: 1.0
    medium_space_headway_ft: 30.0
    high_space_headway_ft: 15.0
    medium_acceleration_fps2: -6.56
    high_acceleration_fps2: -11.20

model:
  input_dim: 4
  lstm_hidden_1: 12
  lstm_hidden_2: 8
  gat_hidden_1: 8
  gat_heads_1: 2
  gat_hidden_2: 8
  gat_heads_2: 1
  fusion_dim: 8
  fusion_attention_hidden: 6
  num_classes: 3
  dropout: 0.0

training:
  epochs: 1
  batch_size: 4
  learning_rate: 0.003
  weight_decay: 0.0
  class_weighting: none
  fused_loss_weight: 1.0
  temporal_aux_loss_weight: 0.2
  spatial_aux_loss_weight: 0.2
  checkpoint_path: results/regenerated/smoke/best_model.pt
  metrics_path: results/regenerated/smoke/metrics.json
  device: cpu
